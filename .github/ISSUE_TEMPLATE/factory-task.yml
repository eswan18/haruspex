name: Factory task
description: A change small and clear enough to hand to the factory agent.
title: ""
body:
  - type: markdown
    attributes:
      value: |
        Filing this starts nothing. The agent begins when the repository's
        owner adds the `factory` label. Add `review-first` as well if its
        pull request should wait for a person even when automatic merging
        is on.

        The agent can change `.ts`, `.tsx` and `.css` files under `app/`,
        `components/`, `lib/`, `hooks/` and `types/`: at most 25 files and 800
        lines. It may add new test files where the change merits one. It
        cannot change the database schema, dependencies, configuration or
        existing tests, and it cannot run the app. It reads
        this issue's title, the fields below, and comments written by the
        owner. Comments from anyone else never reach it.
  - type: textarea
    id: what
    attributes:
      label: What should change
      description: The behaviour wanted, from the point of view of someone using the app.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: Pages, components or files involved, if you know them.
  - type: textarea
    id: done
    attributes:
      label: How to tell it is done
      description: What you will check when you review the pull request.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Out of scope
      description: Anything nearby that should be left alone.
