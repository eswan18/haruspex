name: Bump Fix

# When PR Checks fails on a Dependabot pull request, let the factory agent try
# to repair the code that the new versions broke. Up to MAX_ROUNDS attempts,
# then it hands the pull request to a person by labelling it needs-human. It
# does not touch a pull request that already has that label.
#
# The work is split so that no job holds both the AI and the power to push:
#
#   find      Finds the pull request and counts the attempts so far.
#   propose   Runs the agent (factory-agent.yml, shared with the issue
#             workflows). It can read and edit files inside the checkout and
#             nothing else: no shell, no network tools, no GitHub token, and
#             no access to the rest of the runner's disk. Its only product is
#             a patch, which is treated as untrusted data.
#   push      Runs no AI and no code from the pull request. It checks the patch
#             against the rules in .github/guard (taken from the default
#             branch), and only then commits and pushes it as the factory App.
#   escalate  Labels the pull request and comments when the loop gives up.
#   ready     When checks pass on a bump: merges it if it is a minor/patch
#             update nobody had to touch and automatic merging is switched on;
#             otherwise tells the owner it is ready to review and merge.
#
# workflow_run always uses this file from the default branch, so a pull request
# cannot change it. Event fields such as the branch name are attacker-shaped
# strings: they are passed through `env`, never interpolated into a script.
on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

permissions: {}

concurrency:
  group: bump-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  MAX_ROUNDS: "3"
  # The agent's commits are recognised by this subject line when counting rounds.
  COMMIT_SUBJECT: "Fix call sites after dependency bump"

jobs:
  find:
    name: Find the pull request
    # Same-repository Dependabot branches only. A fork cannot reach this job.
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      round: ${{ steps.pr.outputs.round }}
      give_up: ${{ steps.pr.outputs.give_up }}
    steps:
      - name: Find the pull request and count earlier attempts
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh api --method GET "repos/$REPO/pulls" -f state=open -f head="${REPO%%/*}:$BRANCH" \
            --jq '[.[] | select(.user.login == "dependabot[bot]" and .user.type == "Bot")][0] // empty')
          if [ -z "$pr" ]; then
            echo "No open Dependabot pull request for this branch; nothing to do."
            echo "give_up=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          # Once handed to a person, stay out. The round count below only
          # sees fix commits, so without this a pull request the agent cannot
          # fix would start a new agent run every time its checks fail again.
          # Removing the label lets the agent try again.
          if jq -e '[.labels[].name] | index("needs-human")' <<<"$pr" > /dev/null; then
            echo "Pull request #$number is labelled needs-human; leaving it alone."
            echo "give_up=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(jq -r .head.sha <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "The branch has moved on since this run; a newer run will handle it."
            echo "give_up=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subjects=$(gh api --paginate "repos/$REPO/pulls/$number/commits" \
            --jq '.[].commit.message | split("\n")[0]')
          done_rounds=$(grep -c -F "$COMMIT_SUBJECT" <<<"$subjects" || true)
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "round=$((done_rounds + 1))" >> "$GITHUB_OUTPUT"
          if [ "$done_rounds" -ge "$MAX_ROUNDS" ]; then
            echo "Already tried $done_rounds time(s); handing over to a person."
            echo "give_up=true" >> "$GITHUB_OUTPUT"
          else
            echo "give_up=false" >> "$GITHUB_OUTPUT"
          fi

  propose:
    name: Propose a fix
    needs: find
    if: needs.find.outputs.give_up == 'false'
    permissions:
      contents: read
      actions: read
      issues: read
    uses: ./.github/workflows/factory-agent.yml
    with:
      task: bump
      ref: ${{ github.event.workflow_run.head_sha }}
      failed_run_id: ${{ github.event.workflow_run.id }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  push:
    name: Check and push the fix
    needs: [find, propose]
    if: needs.propose.outputs.patch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # No `ref`: on workflow_run this is the default branch, so these are the
      # rules a pull request cannot have changed.
      - name: Checkout the default branch's rules
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/guard
          path: rules
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Mint a token for the factory App
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          permission-contents: write

      - name: Checkout the failing commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: work
          token: ${{ steps.app.outputs.token }}

      - name: Check the patch, then commit and push it
        working-directory: work
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          PATCH: ${{ needs.propose.outputs.patch }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          ROUND: ${{ needs.find.outputs.round }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          printf '%s' "$PATCH" | base64 -d > "$RUNNER_TEMP/fix.patch"

          # Judge the patch before it touches the tree, then again from the
          # index once applied, in case the two ever disagree.
          git apply --numstat -z "$RUNNER_TEMP/fix.patch" | node ../rules/.github/guard/check-patch.ts
          git apply --index "$RUNNER_TEMP/fix.patch"
          git diff --cached --numstat -z --no-renames | node ../rules/.github/guard/check-patch.ts

          # Ordinary files only: no symlinks, submodules or executables.
          odd_modes=$(git diff --cached --raw --no-renames | awk '$2 != "100644" && $2 != "000000"')
          if [ -n "$odd_modes" ]; then
            echo "Patch refused: it adds something other than an ordinary file:"
            echo "$odd_modes"
            exit 1
          fi

          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m "$COMMIT_SUBJECT (round $ROUND of $MAX_ROUNDS)" \
            -m "PR Checks failed after the bump: $RUN_URL"

          # Fails if the branch has moved since the failing run, which is right:
          # the fix was written against a commit that is no longer the tip.
          git push origin "HEAD:refs/heads/$BRANCH"

  escalate:
    name: Hand over to a person
    needs: [find, propose, push]
    # Out of rounds, no usable patch, or the patch was refused.
    if: >
      always() &&
      needs.find.result == 'success' &&
      needs.find.outputs.give_up != 'skip' &&
      needs.find.outputs.pr_number != '' &&
      needs.push.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Mint a token for the factory App
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          permission-pull-requests: write

      - name: Label the pull request and say why
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.find.outputs.pr_number }}
          GIVE_UP: ${{ needs.find.outputs.give_up }}
          PROPOSE: ${{ needs.propose.result }}
          AGENT_OK: ${{ needs.propose.outputs.agent_ok }}
          PUSH: ${{ needs.push.result }}
          THIS_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTE: ${{ needs.propose.outputs.note }}
        run: |
          set -euo pipefail
          if [ "$GIVE_UP" = "true" ]; then
            reason="it has already tried $MAX_ROUNDS times and PR Checks still fails"
          elif [ "$PROPOSE" != "success" ] || [ "$AGENT_OK" != "true" ]; then
            reason="the agent's run did not finish"
          elif [ "$PUSH" = "skipped" ]; then
            reason="the agent did not produce a change it is allowed to make"
          else
            reason="the agent's change was refused or could not be pushed"
          fi
          gh api --method POST "repos/$REPO/issues/$PR/labels" -f "labels[]=needs-human" > /dev/null
          # It is no longer ready, if it ever was.
          gh api --method DELETE "repos/$REPO/issues/$PR/labels/ready-for-review" > /dev/null 2>&1 || true
          body="The factory agent has stopped working on this bump: $reason. A person needs to take it from here. Details: $THIS_RUN"
          # Quote the agent's report inside a code block, with the fence
          # characters removed from it, so it renders as plain text: no
          # mentions, links or formatting of its own.
          note=$(printf '%s' "$NOTE" | base64 -d 2>/dev/null | tr -d '`~' | head -c 1500 || true)
          if [ -n "$note" ]; then
            body=$(printf '%s\n\nWhat the agent reported:\n\n~~~text\n%s\n~~~\n' "$body" "$note")
          fi
          gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null

  # What happens when a bump's checks pass. Either the factory merges it, or it
  # tells the owner it is ready, so a green bump is never left unnoticed.
  #
  # Merging without a person is limited to one class of change, and is off
  # unless the repository variable FACTORY_AUTOMERGE_BUMPS is "true":
  #
  #   - every commit is Dependabot's own: authored by it, committed and
  #     signed by GitHub (so neither the agent nor anyone else has touched it),
  #   - only package.json and the lockfile changed,
  #   - every direct dependency moved by a minor or patch version
  #     (.github/guard/bump.ts, judged from the files, not from the PR title),
  #   - it was never handed to a person.
  #
  # Everything else that goes green gets a notice: majors, anything the agent
  # fixed, and anything that was handed over and has since started passing.
  # The required checks on main still apply to a merge made here; the App
  # cannot bypass them.
  ready:
    name: Merge it or say it is ready
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # No `ref`: the default branch's rules, which a pull request cannot change.
      - name: Checkout the default branch's rules
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/guard
          path: rules
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Mint a token for the factory App
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_KEY }}
          permission-pull-requests: write
          permission-contents: write

      - name: Decide, then merge or notify
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CHECKS_RUN: ${{ github.event.workflow_run.html_url }}
          AUTOMERGE: ${{ vars.FACTORY_AUTOMERGE_BUMPS }}
        run: |
          set -euo pipefail
          pr=$(gh api --method GET "repos/$REPO/pulls" -f state=open -f head="$OWNER:$BRANCH" \
            --jq '[.[] | select(.user.login == "dependabot[bot]" and .user.type == "Bot")][0] // empty')
          if [ -z "$pr" ]; then
            echo "No open Dependabot pull request for this branch."
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          if [ "$(jq -r .head.sha <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "The branch has moved on since this run; a newer run will decide."
            exit 0
          fi
          has_label() { jq -e --arg name "$1" '[.labels[].name] | index($name)' <<<"$pr" > /dev/null; }
          if has_label ready-for-review; then
            echo "Pull request #$number is already marked ready."
            exit 0
          fi

          notify() {
            gh api --method DELETE "repos/$REPO/issues/$number/labels/needs-human" > /dev/null 2>&1 || true
            gh api --method POST "repos/$REPO/issues/$number/labels" -f "labels[]=ready-for-review" > /dev/null
            gh api --method POST "repos/$REPO/issues/$number/comments" \
              -f body="@$OWNER this bump now passes PR Checks and Smoke. $1 It is ready for you to review and merge. Passing run: $CHECKS_RUN" > /dev/null
            echo "Announced pull request #$number as ready: $1"
          }

          commits=$(gh api --paginate --slurp "repos/$REPO/pulls/$number/commits" | jq 'add')
          fixes=$(jq -r '.[].commit.message | split("\n")[0]' <<<"$commits" | grep -c -F "$COMMIT_SUBJECT" || true)

          # Bumps that have needed attention always go to a person.
          if has_label needs-human; then
            notify "It was handed to a person earlier and its checks have since started passing."
            exit 0
          fi
          if [ "$fixes" -gt 0 ]; then
            notify "The factory agent pushed $fixes fix commit(s) to it, which need reading."
            exit 0
          fi

          # From here the question is whether it may merge without a person.
          # Each test that fails becomes the reason given in the notice.
          why_not=""
          # A Dependabot commit is authored by dependabot[bot], committed by
          # GitHub itself (web-flow) and signed with GitHub's key. The author
          # alone is a claim anyone can make; the committer and signature are
          # what GitHub vouches for, and a commit signed by anyone else's key
          # would have that person as its committer.
          if ! jq -e 'length > 0 and all(.[];
                .author.login == "dependabot[bot]" and .author.type == "Bot"
                and .committer.login == "web-flow"
                and .commit.verification.verified == true
                and .commit.verification.reason == "valid")' <<<"$commits" > /dev/null; then
            why_not="Not every commit is a verified Dependabot commit."
          fi
          if [ -z "$why_not" ]; then
            other_files=$(gh api --paginate "repos/$REPO/pulls/$number/files" --jq '.[].filename' \
              | grep -v -x -F -e package.json -e package-lock.json || true)
            if [ -n "$other_files" ]; then
              why_not="It changes files other than package.json and the lockfile."
            fi
          fi
          if [ -z "$why_not" ]; then
            base_sha=$(jq -r .base.sha <<<"$pr")
            fetch() { gh api "repos/$REPO/contents/$1?ref=$2" -H "Accept: application/vnd.github.raw+json" > "$3"; }
            fetch package.json "$base_sha" "$RUNNER_TEMP/base-package.json"
            fetch package.json "$HEAD_SHA" "$RUNNER_TEMP/head-package.json"
            fetch package-lock.json "$base_sha" "$RUNNER_TEMP/base-lock.json"
            fetch package-lock.json "$HEAD_SHA" "$RUNNER_TEMP/head-lock.json"
            set +e
            node rules/.github/guard/classify-bump.ts \
              "$RUNNER_TEMP/base-package.json" "$RUNNER_TEMP/head-package.json" \
              "$RUNNER_TEMP/base-lock.json" "$RUNNER_TEMP/head-lock.json" > "$RUNNER_TEMP/verdict.json"
            verdict=$?
            set -e
            sed 's/^/> /' "$RUNNER_TEMP/verdict.json"
            if [ "$verdict" -ne 0 ]; then
              why_not="It is not a minor or patch update only: $(jq -r '.reasons | join("; ")' "$RUNNER_TEMP/verdict.json" 2>/dev/null | head -c 500 || echo "it could not be judged")."
            fi
          fi

          if [ -n "$why_not" ]; then
            notify "It needs a person because it does not qualify for automatic merging. $why_not"
            exit 0
          fi

          summary=$(jq -r '[.changes[] | "\(.name) \(.from) to \(.to)"] | join(", ")' "$RUNNER_TEMP/verdict.json" | head -c 800)
          summary=${summary:-indirect dependencies only}
          if [ "$AUTOMERGE" != "true" ]; then
            notify "It qualifies for automatic merging (minor and patch updates only, untouched by the agent: $summary), but automatic merging is switched off."
            exit 0
          fi

          # `sha` makes the merge fail if the branch moved after these checks.
          if gh api --method PUT "repos/$REPO/pulls/$number/merge" \
              -f merge_method=squash -f sha="$HEAD_SHA" > /dev/null; then
            gh api --method POST "repos/$REPO/issues/$number/comments" \
              -f body="Merged automatically: minor and patch updates only, all checks passed, untouched by the agent ($summary). Passing run: $CHECKS_RUN" > /dev/null
            echo "Merged pull request #$number."
          else
            notify "It qualified for automatic merging, but the merge was refused, most likely because a required check has not passed yet."
          fi
