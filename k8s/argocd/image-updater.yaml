# Staging auto-deploy. Prod deliberately has no CR: promotion there is manual
# via `bif promote`.
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: haruspex-staging
  namespace: argocd
spec:
  writeBackConfig:
    method: argocd
  applicationRefs:
    - namePattern: haruspex-staging
      images:
        - alias: haruspex
          imageName: us-central1-docker.pkg.dev/ethans-services/containers/haruspex
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^[a-f0-9]{7,}$"
