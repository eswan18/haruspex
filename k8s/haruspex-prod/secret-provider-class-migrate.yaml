# The database owner's connection string, for the `migrate` initContainer only.
# Kept apart from haruspex-prod-secrets because that class is mounted into the
# app container at /mnt/secrets, and the app deliberately runs as app_user.
# Neon's direct (non-pooler) host: the runner holds a session advisory lock.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: haruspex-prod-migrate-secrets
  namespace: haruspex-prod
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/ethans-services/secrets/haruspex_prod_migrate_database_url/versions/latest"
        path: "DATABASE_URL"
  secretObjects:
    - secretName: haruspex-prod-migrate-secrets
      type: Opaque
      data:
        - objectName: "DATABASE_URL"
          key: DATABASE_URL
